<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credenciais Inválidas - SENAI Almoxarifado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='icone4.png') }}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>    
</head>
<body class="corpo-login">
    <div class="container-login">
        <div class="card-login-wrapper p-4 p-md-5 rounded-4 shadow-lg text-center">
            <img src="{{ url_for('static', filename='logo.png') }}" id="logo" alt="Logo SENAI" class="mb-4">
            
            <h4 class="fw-bold text-white mb-3">Falha na Autenticação</h4>
            <p class="text-white-50 small mb-4">E-mail ou senha informados estão incorretos.</p>

            <a href="{{ url_for('web.login') }}" class="btn btn-warning w-100 py-3 fw-bold fs-6 botao shadow-sm text-dark">
                <i class="bi bi-arrow-left me-1"></i>Tentar Novamente
            </a>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            Swal.fire({
                icon: 'error',
                title: 'Credenciais Inválidas',
                text: 'E-mail ou senha incorretos. Verifique suas informações e tente novamente.',
                confirmButtonColor: '#ff9500', 
                confirmButtonText: 'Voltar ao Login'
            }).then(() => {
                window.location.href = "{{ url_for('web.login') }}";
            });
        });
    </script>
</body>
</html>
