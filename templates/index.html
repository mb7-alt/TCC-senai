<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SENAI Almoxarifado</title>

    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='icone.png') }}">
</head>
<body class="corpo-login">
    <div class="container-login">
        <div class="card-login-wrapper p-4 p-md-5 rounded-4 shadow-lg text-center">
            <img src="{{ url_for('static', filename='logo.png') }}" id="logo" alt="Logo SENAI / SESI" class="mb-4">
            
            <h4 class="fw-bold text-white mb-1">Almoxarifado Integrado</h4>
            <p class="text-white-50 small mb-4">Controle e Gestão de Materiais</p>

            {% if erro %}
            <div class="alert alert-danger py-2 small mb-3 text-start d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-octagon-fill"></i>
                <span>{{ erro }}</span>
            </div>
            {% endif %}

            <form id="meuFormularioLogin" action="/login" method="POST">
                <div class="mb-3 text-start">
                    <label class="form-label label-customizada"><i class="bi bi-envelope me-1"></i>E-mail Institucional</label>
                    <input type="email" class="form-control input-customizado" id="campoEmail" name="username" placeholder="exemplo@senai.br" required autofocus>
                </div>
                
                <div class="mb-4 text-start">
                    <label class="form-label label-customizada"><i class="bi bi-key me-1"></i>Senha de Acesso</label>
                    <div class="input-group">
                        <input type="password" class="form-control input-customizado border-end-0" id="senhaLogin" name="password" placeholder="Digite sua senha" required>
                        <button class="btn btn-light border border-start-0" type="button" onclick="toggleSenha()">
                            <i class="bi bi-eye text-muted" id="iconeOlho"></i>
                        </button>
                    </div>
                </div>           
                
                <button type="submit" class="btn btn-warning w-100 py-3 fw-bold fs-6 botao shadow-sm text-dark">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Acessar o Sistema
                </button>            
            </form>

            <div class="mt-4 pt-3 border-top border-white border-opacity-25 text-white-50 small">
                <span>Dica de acesso rápido (clique para preencher):</span>
                <div class="mt-2 d-flex justify-content-center gap-2 flex-wrap">
                    <button type="button" class="btn btn-sm btn-outline-warning text-white" onclick="preencherLogin('ednaldo@gmail.com', '123456')">
                        <i class="bi bi-shield-lock me-1"></i>Admin (Ednaldo)
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-light" onclick="preencherLogin('mauricio@gmail.com', '123456')">
                        <i class="bi bi-person me-1"></i>Comum (Maurício)
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleSenha() {
            const input = document.getElementById('senhaLogin');
            const icone = document.getElementById('iconeOlho');
            if (input.type === 'password') {
                input.type = 'text';
                icone.className = 'bi bi-eye-slash text-muted';
            } else {
                input.type = 'password';
                icone.className = 'bi bi-eye text-muted';
            }
        }

        function preencherLogin(email, senha) {
            document.getElementById('campoEmail').value = email;
            document.getElementById('senhaLogin').value = senha;
        }
    </script>
</body>
</html>
