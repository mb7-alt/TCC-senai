<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="/static/icone.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Certificação</title>
</head>
<body class="corpo-login">
    <div class="container-login">
        <img src="{{ url_for('static', filename='logo.png') }}" id="logo" alt="Logo SESI">
        <form id="meuFormularioLogin" action="/login" method="POST">
            <div class="mb-3 text-start">
                <label for="exampleInputEmail1" class="form-label label-customizada">E-mail</label>
                <input type="text" class="input-customizado" name="username" placeholder="Digite seu e-mail ou usuário" required>
            </div>
            <div class="mb-3 text-start">
                <label for="exampleInputPassword1" class="form-label label-customizada">Senha</label>
                <input type="password" class="input-customizado" name="password" placeholder="Digite sua senha" required>
            </div>           
            <button type="submit" class="botao">Entrar</button>            
        </form>
    </div>
</body>
</html>
