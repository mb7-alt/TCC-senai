{% extends "base.html" %}

{% block title %}Ferramenta Cadastrada - SENAI Almoxarifado{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-12 col-md-8 col-lg-6 text-center">
        <div class="card shadow-sm border-0 rounded-4 p-5">
            <div class="mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle p-4">
                    <i class="bi bi-check-circle-fill display-3"></i>
                </div>
            </div>
            <h3 class="fw-bold text-dark mb-2">Item Cadastrado com Sucesso!</h3>
            <p class="text-muted mb-4">A nova ferramenta já está disponível no catálogo do almoxarifado.</p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{{ url_for('web.home') }}" class="btn btn-primary px-4 py-2">
                    <i class="bi bi-grid-fill me-1"></i>Ir para o Estoque
                </a>
                <a href="{{ url_for('web.lista') }}" class="btn btn-outline-warning px-4 py-2 text-dark">
                    <i class="bi bi-plus-lg me-1"></i>Cadastrar Outro Item
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
