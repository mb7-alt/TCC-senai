{% extends "base.html" %}

{% block title %}Cadastro de Ferramenta - SENAI Almoxarifado{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-primary text-white py-3">
                <h5 class="mb-0 fw-bold d-flex align-items-center gap-2">
                    <i class="bi bi-plus-circle-fill"></i>
                    <span>Cadastro de Nova Ferramenta / Material</span>
                </h5>
            </div>
            <div class="card-body p-4">
                <form id="formNovoItem" action="/lista-sucesso" method="POST">
                    <div class="row g-3">
                        <!-- Nome -->
                        <div class="col-12 col-md-8">
                            <label class="form-label fw-semibold small text-secondary">Nome da Ferramenta / Equipamento *</label>
                            <input type="text" name="nome" id="nomeItem" class="form-control" placeholder="Ex: Chave Phillips 3/16x4" required>
                        </div>

                        <!-- Categoria -->
                        <div class="col-12 col-md-4">
                            <label class="form-label fw-semibold small text-secondary">Categoria *</label>
                            <input type="text" name="categoria" id="categoriaItem" class="form-control" list="listaCategorias" placeholder="Ex: Mecânica, Elétrica..." required>
                            <datalist id="listaCategorias">
                                {% for cat in categorias %}
                                <option value="{{ cat }}"></option>
                                {% endfor %}
                            </datalist>
                        </div>

                        <!-- Preço -->
                        <div class="col-12 col-sm-4">
                            <label class="form-label fw-semibold small text-secondary">Preço Unitário (R$) *</label>
                            <div class="input-group">
                                <span class="input-group-text">R$</span>
                                <input type="number" step="0.01" min="0" name="preco" id="precoItem" class="form-control" placeholder="0.00" required>
                            </div>
                        </div>

                        <!-- Quantidade Inicial -->
                        <div class="col-12 col-sm-4">
                            <label class="form-label fw-semibold small text-secondary">Quantidade Inicial *</label>
                            <input type="number" min="0" step="1" name="quantidade" id="qtdItem" class="form-control" placeholder="0" required>
                        </div>

                        <!-- Estoque Mínimo -->
                        <div class="col-12 col-sm-4">
                            <label class="form-label fw-semibold small text-secondary">Estoque Mínimo (Alerta) *</label>
                            <input type="number" min="0" step="1" name="quantidade_min" id="estoqueMinItem" class="form-control" placeholder="Ex: 5" required>
                        </div>

                        <!-- Descrição -->
                        <div class="col-12">
                            <label class="form-label fw-semibold small text-secondary">Descrição e Aplicação *</label>
                            <textarea name="descricao" id="descricaoItem" class="form-control" rows="2" placeholder="Descreva brevemente para que serve a ferramenta..." required></textarea>
                        </div>

                        <!-- Imagem URL com Preview -->
                        <div class="col-12">
                            <label class="form-label fw-semibold small text-secondary">URL da Imagem da Ferramenta *</label>
                            <div class="input-group mb-2">
                                <span class="input-group-text"><i class="bi bi-image"></i></span>
                                <input type="url" name="imagem" id="imagemItem" class="form-control" placeholder="https://exemplo.com/imagem.jpg" required oninput="atualizarPreview()">
                            </div>
                            <div id="previewContainer" class="p-2 border rounded bg-light text-center" style="display: none;">
                                <small class="text-muted d-block mb-1">Pré-visualização da Imagem:</small>
                                <img id="previewImg" src="" alt="Prévia" class="img-thumbnail" style="max-height: 140px; object-fit: contain;">
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4 pt-2 border-top">
                        <a href="{{ url_for('web.home') }}" class="btn btn-outline-secondary px-4">Cancelar</a>
                        <button type="submit" id="btnSalvarItem" class="btn btn-warning px-4 fw-bold text-dark">
                            <i class="bi bi-check-lg me-1"></i>Salvar Ferramenta
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function atualizarPreview() {
        const url = document.getElementById('imagemItem').value.trim();
        const container = document.getElementById('previewContainer');
        const img = document.getElementById('previewImg');

        if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
            img.src = url;
            img.onload = () => { container.style.display = 'block'; };
            img.onerror = () => { container.style.display = 'none'; };
        } else {
            container.style.display = 'none';
        }
    }
</script>
{% endblock %}
