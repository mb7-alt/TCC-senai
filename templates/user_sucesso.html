{% extends "base.html" %}

{% block title %}Usuário Cadastrado - SENAI Almoxarifado{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-12 col-md-8 col-lg-6 text-center">
        <div class="card shadow-sm border-0 rounded-4 p-5">
            <div class="mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle p-4">
                    <i class="bi bi-person-check-fill display-3"></i>
                </div>
            </div>
            <h3 class="fw-bold text-dark mb-2">Usuário Criado com Sucesso!</h3>
            <p class="text-muted mb-4">A conta já foi salva e está pronta para autenticar no sistema web e mobile.</p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{{ url_for('web.users') }}" class="btn btn-primary px-4 py-2">
                    <i class="bi bi-people-fill me-1"></i>Ver Usuários
                </a>
                <a href="{{ url_for('web.home') }}" class="btn btn-outline-secondary px-4 py-2">
                    <i class="bi bi-grid-fill me-1"></i>Ir para o Início
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
